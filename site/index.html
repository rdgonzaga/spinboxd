<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>spinboxd · Rai &amp; Ia's watchlist</title>
  <meta name="description" content="Rai &amp; Ia's watchlist. Picks a film from our Letterboxd list so we stop arguing about it.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rai &amp; Ia's watchlist">
  <meta property="og:description" content="Picks a film from our Letterboxd list so we stop arguing about it.">
  <meta property="og:url" content="https://rdgonzaga.github.io/spinboxd/">
  <meta property="og:image" content="https://rdgonzaga.github.io/spinboxd/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="spinboxd, Rai &amp; Ia's watchlist">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#14181c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314181c'/%3E%3Ccircle cx='8' cy='16' r='5' fill='%23ff8000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2300e054'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%2340bcf4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="./" aria-label="spinboxd">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1 class="wordmark">spinboxd</h1>
      </a>
      <nav class="sources" id="sources" role="group" aria-label="Film source"></nav>
    </div>
  </header>

  <main class="wrap">
    <p class="tagline"><strong>Rai &amp; Ia's watchlist</strong> <span>From <a href="https://letterboxd.com/rdgonzaga/list/rai-and-ias-watch-list/" target="_blank" rel="noopener noreferrer">our list on Letterboxd</a></span></p>
    <p class="msg" id="error" hidden>Couldn't load the film list. Reload the page to try again.</p>
    <p class="note" id="note" hidden></p>

    <div class="heading">
      <p class="count" id="count" aria-live="polite"></p>
      <button class="btn btn-primary" id="pick" type="button" disabled>Pick a film</button>
    </div>

    <div class="filters" id="filters"></div>

    <ul class="grid" id="grid"></ul>
  </main>

  <footer class="wrap credit">
    <p>Film data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming data from <a href="https://www.justwatch.com/" target="_blank" rel="noopener noreferrer">JustWatch</a>.</p>
  </footer>

  <dialog class="stage" id="stage" aria-label="Tonight's pick">
    <div class="stage-bar">
      <button class="link-btn" id="close" type="button">Close</button>
    </div>
    <div class="reel" id="reel" aria-hidden="true">
      <div class="reel-strip" id="strip"></div>
    </div>
    <article class="result" id="result" hidden>
      <div class="result-poster" id="result-poster"></div>
      <div class="result-body">
        <p class="eyebrow">Tonight's pick</p>
        <h2 id="result-title" tabindex="-1"></h2>
        <p class="result-meta" id="result-meta"></p>
        <p class="result-rating" id="result-rating" hidden></p>
        <p class="result-overview" id="result-overview" hidden></p>
        <button class="link-btn more" id="result-more" type="button" hidden>More</button>
        <p class="result-providers" id="result-providers" hidden></p>
        <div class="result-actions">
          <button class="btn btn-primary" id="respin" type="button">Spin again</button>
          <button class="btn btn-quiet" id="copy-link" type="button">Copy link</button>
          <a class="btn btn-quiet" id="result-link" target="_blank" rel="noopener noreferrer">View on Letterboxd</a>
        </div>
      </div>
    </article>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
