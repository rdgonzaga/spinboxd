name: update

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, scraper/**, config.toml, data/tmdb_overrides.toml, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # the scraped data lives on the `data` branch so main only holds code;
      # the scraper needs last run's list (to keep a list that fails to scrape) and the TMDB cache
      - name: Restore last run's data
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- site/data/watchlist.json data/tmdb_cache.json
          else
            echo "no data branch yet, starting fresh"
          fi

      - name: Scrape
        id: scrape
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m scraper
        continue-on-error: true

      # one commit with just the two data files, force-pushed, so the branch never grows a history
      - name: Save data to the data branch
        run: |
          git config user.name "spinboxd[bot]"
          git config user.email "actions@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          git add -f site/data/watchlist.json data/tmdb_cache.json
          commit=$(git commit-tree "$(git write-tree)" -m "chore(data): update watchlist")
          git push --force origin "$commit:refs/heads/data"

      - name: Check the TMDB key isn't in the site
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ] && grep -rqF "$TMDB_API_KEY" site; then
            echo "TMDB key found in site/, not deploying"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if the main list didn't scrape
        if: steps.scrape.outcome == 'failure'
        run: exit 1
